name: Build and Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    paths:
      - '.github/scripts/**'
      - '.github/workflows/deploy-pages.yml'
      - 'appendix/**'
      - 'bibliography/**'
      - 'chapters/**'
      - 'fonts/**'
      - 'signatures/**'
      - 'style/**'
      - 'SWJTU_Bachelor_Thesis.tex'

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.3

      - name: Resolve TeX Live packages
        run: python3 .github/scripts/resolve_texlive_packages.py --platform x86_64-linux --output .github/texlive-packages.generated

      - name: Read TeX Live cache scope
        id: texlive-cache
        run: |
          release=$(sed -n 's/^# TeX Live release: //p' .github/texlive-packages.generated)
          if [[ -z "$release" || "$release" == "unknown" ]]; then
            release=current
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Cache TeX Live
        uses: actions/cache@v5.0.5
        with:
          path: .texlive
          key: texlive-${{ runner.os }}-x86_64-linux-${{ steps.texlive-cache.outputs.release }}-${{ hashFiles('.github/texlive-packages.generated') }}
          restore-keys: |
            texlive-${{ runner.os }}-x86_64-linux-${{ steps.texlive-cache.outputs.release }}-

      - name: Set up TeX Live
        run: python3 .github/scripts/setup_texlive.py --platform x86_64-linux --package-file .github/texlive-packages.generated

      - name: Build PDF
        run: python3 .github/scripts/build_latex.py

      - name: Prepare site directory
        run: |
          mkdir -p site
          cp build/SWJTU_Bachelor_Thesis.pdf site/

      - name: Get Latest Release URL
        id: get-latest-release-url
        run: |
          if [[ "${GITHUB_REF}" =~ refs/tags/(v.*) ]]; then
            TRIGGER_TAG="${BASH_REMATCH[1]}"
          else
            TRIGGER_TAG=""
          fi

          if [[ -n "$TRIGGER_TAG" ]]; then
            echo "Latest tag: $TRIGGER_TAG"
            
            MAX_RETRIES=60
            RETRY=0
            
            while true; do
              VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
              echo "Latest release version: $VERSION"
              
              if [[ "$VERSION" == "$TRIGGER_TAG" ]]; then
                echo "Release is available."
                break
              fi
              
              if [[ $RETRY -ge $MAX_RETRIES ]]; then
                echo "Timed out waiting for release $TRIGGER_TAG to be available." >&2
                exit 1
              fi
              
              echo "Release not available yet. Waiting 10 seconds... ($((RETRY+1))/$MAX_RETRIES)"
              sleep 10
              RETRY=$((RETRY+1))
            done
          else
            # Not a tag push: just get the latest release
            VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
            echo "Latest release version: $VERSION"
          fi
          ZIP_NAME="SWJTU_Bachelor_Thesis_${VERSION}.zip"
          OVERLEAF_URL="https://www.overleaf.com/docs?snip_uri=https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ZIP_NAME}&main_document=SWJTU_Bachelor_Thesis.tex&engine=xelatex"
          echo "overleafUrl=$OVERLEAF_URL" >> $GITHUB_OUTPUT

      - name: Generate Overleaf Redirect HTML
        run: |
          cat <<EOF > site/index.html
          <!DOCTYPE html>
          <html>  
          <head>
              <meta http-equiv="refresh" content="0; url=${{ steps.get-latest-release-url.outputs.overleafUrl }}" />
              <title>正在跳转至 Overleaf...</title>
          </head>
          <body>
              <p>正在跳转至 <a href="${{ steps.get-latest-release-url.outputs.overleafUrl }}">Overleaf</a>...</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload static site to GitHub Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
