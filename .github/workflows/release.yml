name: Release Source Zip

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Get tag message
        id: tag-message
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' "$(git describe --tags --exact-match)")
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get version
        id: get-version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Resolve TeX Live packages
        run: python3 .github/scripts/resolve_texlive_packages.py --platform x86_64-linux --output .github/texlive-packages.generated

      - name: Read TeX Live cache scope
        id: texlive-cache
        run: |
          release=$(sed -n 's/^# TeX Live release: //p' .github/texlive-packages.generated)
          if [[ -z "$release" || "$release" == "unknown" ]]; then
            release=current
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Cache TeX Live
        uses: actions/cache@v5.0.5
        with:
          path: .texlive
          key: texlive-${{ runner.os }}-x86_64-linux-${{ steps.texlive-cache.outputs.release }}-${{ hashFiles('.github/texlive-packages.generated') }}
          restore-keys: |
            texlive-${{ runner.os }}-x86_64-linux-${{ steps.texlive-cache.outputs.release }}-

      - name: Set up TeX Live
        run: python3 .github/scripts/setup_texlive.py --platform x86_64-linux --package-file .github/texlive-packages.generated

      - name: Compile LaTeX (xelatex -> biber -> xelatex*2)
        run: python3 .github/scripts/build_latex.py

      - name: Zip source files
        run: |
          zip -r SWJTU_Bachelor_Thesis_v${{ steps.get-version.outputs.version }}.zip \
            appendix/ bibliography/ chapters/ fonts/ signatures/ style/ SWJTU_Bachelor_Thesis.tex LICENSE

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: SWJTU_Bachelor_Thesis_v${{ steps.get-version.outputs.version }}.zip
          name: ${{ steps.get-version.outputs.version }}
          body: ${{ steps.tag-message.outputs.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
